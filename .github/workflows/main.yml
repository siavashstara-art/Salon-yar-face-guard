's 
name: Build Rose Guard Release APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and Verify Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check required signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing RELEASE_STORE_PASSWORD secret."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing RELEASE_KEY_PASSWORD secret."
            exit 1
          fi

          echo "Required signing secrets are present."

      - name: Restore permanent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p app

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > app/my-upload-key.jks

          test -s app/my-upload-key.jks

          keytool -list \
            -keystore app/my-upload-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias upload

          echo "Release keystore verified."

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace

      - name: Verify Release APK exists
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Release APK was not generated."
            find app/build/outputs/apk -type f || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rose-guard-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
